<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fangqi</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#e6d7bd;color:#30251c}.board{display:grid;grid-template-columns:repeat(7,minmax(38px,64px));gap:3px;justify-content:center;margin:20px auto}.cell{aspect-ratio:1;border:1px solid #745b42;background:#f7ecd5;border-radius:50%;font-size:25px}.black{background:#30251c;color:white}.white{background:white;color:#30251c}.selected{outline:3px solid #d09024}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head>
<body><h1>Fangqi</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Phase: <b id="phase">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><script>
const socket=io(); const board=document.getElementById('board'); const status=document.getElementById('status'); const color=document.getElementById('color'); const phase=document.getElementById('phase'); const turn=document.getElementById('turn'); let me,state,selected=null;
socket.on('connect',()=>socket.emit('queue','squarechess')); socket.on('queueWaiting',d=>status.textContent=d.message); socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)}); socket.on('updateGame',d=>render(d.gameState)); socket.on('gameover',d=>status.textContent=`${d.winner} wins`); socket.on('errorMessage',m=>status.textContent=m);
function render(s){state=s;phase.textContent=s.phase;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((piece,i)=>{const cell=document.createElement('button');cell.className=`cell ${piece||''} ${selected===i?'selected':''}`;cell.textContent=piece?'●':'';cell.onclick=()=>click(i);board.appendChild(cell)})}
function click(i){if(state.pendingRemoval||state.phase==='placement'){socket.emit('move',{to:i});return}if(selected===null){if(state.board[i]===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tamerlane Chess</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#302117;background:#9a805d}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#9a805d}main{width:min(800px,100%);margin:auto;text-align:center}.board{width:min(96vw,760px);aspect-ratio:10/11;margin:18px auto;display:grid;grid-template-columns:repeat(10,1fr);border:7px solid #45301e}.cell{display:grid;place-items:center;padding:0;border:1px solid #7f5c3b;background:#dfbd81;cursor:pointer}.cell:nth-child(odd){background:#b98d59}.cell.selected{outline:3px solid #cf9f35;outline-offset:-3px}.cell.valid{box-shadow:inset 0 0 0 4px #4d9760}.piece{width:76%;height:76%;display:grid;place-items:center;border:2px solid #45301e;border-radius:50%;background:#f2dfb3;font:bold clamp(10px,2.4vw,25px) Arial}.white{color:#962d2d}.black{color:#191919}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><main><h1>Tamerlane Chess</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="board" class="board" aria-label="Tamerlane chess board"></div></main><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn'),labels={king:'K',general:'G',rook:'R',knight:'N',camel:'C',elephant:'E',giraffe:'Gf',dabbaba:'D',pawn:'P'};let player,state,selected;socket.on('connect',()=>socket.emit('queue','tamerlane'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('validMoves',p=>{document.querySelectorAll('.valid').forEach(x=>x.classList.remove('valid'));p.moves.forEach(x=>cell(x.row,x.col).classList.add('valid'))});socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function cell(r,c){return board.children[r*10+c]}function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((row,r)=>row.forEach((piece,c)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.onclick=()=>select(r,c);if(piece){const p=document.createElement('span');p.className=`piece ${piece.color}`;p.textContent=labels[piece.type];b.appendChild(p)}board.appendChild(b)}))}function select(r,c){const piece=state.board[r][c];if(!selected){if(!piece||piece.color!==player||state.currentPlayer!==player)return;selected={row:r,col:c};cell(r,c).classList.add('selected');socket.emit('getValidMoves',{from:selected});return}socket.emit('move',{from:selected,to:{row:r,col:c}});selected=null}</script></body></html>

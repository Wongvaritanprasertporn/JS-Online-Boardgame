<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gomoku</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#302117;background:#bd955e}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#bd955e}main{width:min(760px,100%);margin:auto;text-align:center}.board{width:min(96vw,700px);aspect-ratio:1;margin:18px auto;display:grid;grid-template-columns:repeat(15,1fr);border:7px solid #4a2d18;background:#d3a66c}.cell{display:grid;place-items:center;padding:0;border:1px solid #8b6138;background:#d7ad72;cursor:pointer}.cell:nth-child(odd){background:#c59a60}.stone{width:78%;height:78%;border-radius:50%;box-shadow:inset 2px 2px 4px #fff6,2px 2px 4px #0006}.black{background:#1c1c1c}.white{background:#f6f1df;border:1px solid #555}</style></head><body><main><h1>Gomoku</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="board" class="board" aria-label="Gomoku board"></div></main><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let player,state;socket.on('connect',()=>socket.emit('queue','gomoku'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('gameover',p=>status.textContent=p.winner==='draw'?'Draw':`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((row,r)=>row.forEach((value,c)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.onclick=()=>{if(!value&&state.currentPlayer===player&&!state.isGameOver)socket.emit('move',{row:r,col:c})};if(value){const stone=document.createElement('span');stone.className=`stone ${value}`;b.appendChild(stone)}board.appendChild(b)}))}</script></body></html>

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chopsticks</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;margin:20px;background:#d5bfdc}.hands{display:flex;justify-content:center;gap:30px;margin:30px}.hand{padding:20px;background:#f5edf7;border-radius:12px}.hand button{font-size:28px;margin:8px;padding:15px}</style></head><body><h1>Chopsticks</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="game"></div><script>const socket=io(),game=document.getElementById('game'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state;socket.on('connect',()=>socket.emit('queue','chopsticks'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{me=p.color;color.textContent=me;render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;const own=s.hands[me],opp=me==='black'?'white':'black';game.innerHTML=`<div class="hand"><h2>Your hands</h2>${own.map((v,i)=>`<button onclick="attack(${i},0)">${v}</button><button onclick="attack(${i},1)">${v}</button>`).join('')}<p>Split total:</p><button onclick="split(0)">0 / ${own[0]+own[1]}</button><button onclick="split(1)">1 / ${own[0]+own[1]-1}</button><button onclick="split(2)">2 / ${own[0]+own[1]-2}</button></div><div class="hand"><h2>Opponent</h2><p>${s.hands[opp].join(' / ')}</p></div>`}function attack(from,to){if(state.currentPlayer===me)socket.emit('move',{type:'attack',from,to})}function split(amount){if(state.currentPlayer===me)socket.emit('move',{type:'split',from:0,to:1,amount})}</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Courier Chess</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#302116;background:#b8996b}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#b8996b}main{width:min(820px,100%);margin:auto;text-align:center}.board{width:min(97vw,790px);aspect-ratio:12/8;margin:18px auto;display:grid;grid-template-columns:repeat(12,1fr);border:7px solid #4b2e1b}.cell{display:grid;place-items:center;padding:0;border:1px solid #7d5838;background:#e4c58d;cursor:pointer}.cell:nth-child(odd){background:#b88654}.cell.selected{outline:3px solid #c62828;outline-offset:-3px}.cell.valid{box-shadow:inset 0 0 0 4px #4d9860}.piece{width:76%;height:76%;display:grid;place-items:center;border:2px solid #4b2e1b;border-radius:50%;background:#f5e2b7;font:bold clamp(11px,2.5vw,27px) Arial}.white{color:#9b2d2d}.black{color:#171717}</style></head><body><main><h1>Courier Chess</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="board" class="board" aria-label="Courier chess board"></div></main><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn'),labels={king:'K',sage:'S',ferz:'F',fool:'W',courier:'C',alfil:'A',rook:'R',knight:'N',pawn:'P'};let player,state,selected;socket.on('connect',()=>socket.emit('queue','courier'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('validMoves',p=>{document.querySelectorAll('.valid').forEach(x=>x.classList.remove('valid'));p.moves.forEach(x=>cell(x.row,x.col).classList.add('valid'))});socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function cell(r,c){return board.children[r*12+c]}function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((row,r)=>row.forEach((piece,c)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.onclick=()=>select(r,c);if(piece){const p=document.createElement('span');p.className=`piece ${piece.color}`;p.textContent=labels[piece.type];b.appendChild(p)}board.appendChild(b)}))}function select(r,c){const piece=state.board[r][c];if(!selected){if(!piece||piece.color!==player||state.currentPlayer!==player)return;selected={row:r,col:c};cell(r,c).classList.add('selected');socket.emit('getValidMoves',{from:selected});return}socket.emit('move',{from:selected,to:{row:r,col:c}});selected=null}</script></body></html>

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armenian Checkers</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#d7c5a6;color:#30251c}.board{display:grid;grid-template-columns:repeat(8,minmax(32px,58px));justify-content:center;margin:22px auto}.cell{aspect-ratio:1;border:1px solid #806649;font-size:22px;background:#ecdcc0}.cell:nth-child(even){background:#a78967}.black{background:#28231f!important;color:white}.white{background:white!important;color:#28231f}.selected{outline:3px solid #d18e28}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Armenian Checkers</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected=null;socket.on('connect',()=>socket.emit('queue','armeniancheckers'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)});socket.on('updateGame',d=>render(d.gameState));socket.on('gameover',d=>status.textContent=`${d.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((piece,i)=>{const cell=document.createElement('button');cell.className=`cell ${piece?.color||''} ${selected===i?'selected':''}`;cell.textContent=piece?(piece.king?'K':'●'):'';cell.onclick=()=>click(i);board.appendChild(cell)})}function click(i){if(selected===null){if(state.board[i]?.color===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}</script></body></html>

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cram</title><script src="/socket.io/socket.io.js"></script><style>body{text-align:center;font:16px Georgia;background:#cfbda0}.grid{display:grid;grid-template-columns:repeat(6,48px);justify-content:center}.cell{height:48px;border:1px solid #765;background:#ecdcc0}.used{background:#765}.selected{outline:3px solid #d08e27}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Cram</h1><p id="s">Connecting...</p><div id="g" class="grid"></div><script>const x=io(),g=document.getElementById('g'),s=document.getElementById('s');let selected=null;x.on('connect',()=>x.emit('queue','cram'));x.on('roomFound',d=>render(d.gameState));x.on('updateGame',d=>render(d.gameState));x.on('gameover',d=>s.textContent=`${d.winner} wins`);function render(z){s.textContent=`Turn: ${z.currentPlayer}`;g.innerHTML='';z.board.forEach((v,i)=>{const b=document.createElement('button');b.className=`cell ${v?'used':''} ${selected===i?'selected':''}`;b.onclick=()=>{if(selected===null)selected=i;else{x.emit('move',{from:selected,to:i});selected=null}render(z)};g.appendChild(b)})}</script></body></html>

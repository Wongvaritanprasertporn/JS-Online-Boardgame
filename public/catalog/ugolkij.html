<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ugolkij</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#d2c2a8;color:#30251c}.board{display:grid;grid-template-columns:repeat(8,minmax(32px,58px));justify-content:center;margin:24px auto}.cell{aspect-ratio:1;border:1px solid #806649;font-size:22px}.light{background:#f1e2c7}.dark{background:#a88968}.black{background:#29251f;color:white}.white{background:#fff;color:#29251f}.selected{outline:3px solid #d18d25}</style></head>
<body><h1>Ugolkij</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><script>
const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected=null;
socket.on('connect',()=>socket.emit('queue','ugolkij'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)});socket.on('updateGame',d=>render(d.gameState));socket.on('gameover',d=>status.textContent=`${d.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);
function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((piece,i)=>{const cell=document.createElement('button');cell.className=`cell ${((Math.floor(i/8)+i%8)%2?'dark':'light')} ${piece||''} ${selected===i?'selected':''}`;cell.textContent=piece?'●':'';cell.onclick=()=>click(i);board.appendChild(cell)})}function click(i){if(selected===null){if(state.board[i]===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}
</script></body></html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Five-Field Kono</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
            color: #ecf0f1;
        }

        #game-container {
            text-align: center;
            background: #34495e;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        #status {
            font-size: 16px;
            margin-bottom: 20px;
            color: #3498db;
        }

        .info-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-item {
            background: #2c3e50;
            padding: 10px 20px;
            border-radius: 4px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 10px;
            margin: 30px auto;
            background: #1a252f;
            padding: 30px;
            border-radius: 8px;
            width: fit-content;
        }

        .field {
            width: 80px;
            height: 80px;
            border: 2px solid #7f8c8d;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: #2c3e50;
            position: relative;
            transition: all 0.3s;
            font-size: 32px;
        }

        .field:hover {
            background: #34495e;
            transform: scale(1.05);
        }

        .field.selected {
            background: #3498db;
            border-color: #2980b9;
        }

        .field.valid-move {
            background: #27ae60;
            border-color: #229954;
        }

        .field.center {
            grid-column: 2;
            grid-row: 2;
        }

        .field.top {
            grid-column: 2;
            grid-row: 1;
        }

        .field.right {
            grid-column: 3;
            grid-row: 2;
        }

        .field.bottom {
            grid-column: 2;
            grid-row: 3;
        }

        .field.left {
            grid-column: 1;
            grid-row: 2;
        }

        .field.empty {
            grid-column: 1;
            grid-row: 1;
            visibility: hidden;
        }

        .field.empty:nth-child(3) {
            grid-column: 3;
            grid-row: 1;
            visibility: hidden;
        }

        .field.empty:nth-child(7) {
            grid-column: 1;
            grid-row: 3;
            visibility: hidden;
        }

        .field.empty:nth-child(9) {
            grid-column: 3;
            grid-row: 3;
            visibility: hidden;
        }

        .piece {
            font-size: 40px;
            cursor: pointer;
        }

        .piece.black {
            color: #2c3e50;
        }

        .piece.white {
            color: #ecf0f1;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .overlay-content {
            background: #34495e;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
        }

        .overlay-content h1 {
            margin-bottom: 20px;
        }

        .overlay-content button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
        }

        .overlay-content button:hover {
            background: #2980b9;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        button:hover {
            background: #2980b9;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <h1>Five-Field Kono</h1>
        <div id="status">Waiting for an opponent...</div>

        <div class="info-container">
            <div class="info-item">Color: <span id="you">-</span></div>
            <div class="info-item">Turn: <span id="turn">-</span></div>
            <div class="info-item">Your Pieces: <span id="player-pieces">1</span></div>
            <div class="info-item">Opponent Pieces: <span id="opponent-pieces">1</span></div>
        </div>

        <div id="board"></div>

        <div class="controls">
            <button onclick="leaveGame()">Leave Game</button>
        </div>
    </div>

    <div id="overlay" onclick="closeOverlay()">
        <div class="overlay-content" onclick="event.stopPropagation()">
            <h1 id="overlay-title">Game Over</h1>
            <p id="overlay-message"></p>
            <button onclick="closeOverlay()">Close</button>
        </div>
    </div>

    <script>
        const statusElement = document.getElementById('status');
        const boardElement = document.getElementById('board');
        const turnElement = document.getElementById('turn');
        const colorElement = document.getElementById('you');
        const playerPiecesElement = document.getElementById('player-pieces');
        const opponentPiecesElement = document.getElementById('opponent-pieces');

        let playerColor = null;
        let gameActive = false;
        let selectedField = null;
        let gameState = null;

        const socket = io();

        // Field layout: 0=center, 1=top, 2=right, 3=bottom, 4=left
        const fieldLayout = ['center', 'top', 'right', 'bottom', 'left'];

        socket.on('connect', () => {
            console.log(`Connected with ID: ${socket.id}`);
            statusElement.textContent = 'Searching for opponent...';
            socket.emit('queue', 'fivefieldkono');
        });

        socket.on('queueWaiting', (data) => {
            statusElement.textContent = data.message;
        });

        socket.on('roomFound', (payload) => {
            playerColor = payload.color;
            gameActive = true;
            gameState = payload.gameState;
            colorElement.textContent = playerColor;
            statusElement.textContent = `Matched! You are ${playerColor}.`;
            turnElement.textContent = payload.gameState.currentPlayer;
            updatePieceCount();
            renderBoard();
        });

        socket.on('updateGame', (payload) => {
            gameState = payload.gameState;
            turnElement.textContent = payload.gameState.currentPlayer;
            updatePieceCount();
            renderBoard();
        });

        socket.on('gameover', (result) => {
            gameActive = false;
            showOverlay('Game Over', result.message || 'Game ended.');
        });

        socket.on('player_leave', (data) => {
            gameActive = false;
            showOverlay('Opponent Disconnected', data?.message || 'Your opponent left the game.');
        });

        socket.on('errorMessage', (message) => {
            statusElement.textContent = message;
        });

        function createBoard() {
            boardElement.innerHTML = '';
            // Create 9 cells for 3x3 grid (but only 5 are visible)
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                const fieldIndex = [0, 1, 0, 2, 0, 3, 0, 4, 0][i];
                
                if ([0, 1, 3, 5, 7].includes(i)) {
                    // Visible fields
                    cell.classList.add('field', fieldLayout[fieldIndex]);
                    cell.dataset.field = fieldIndex;
                    cell.addEventListener('click', () => handleFieldClick(fieldIndex));
                } else {
                    // Empty corner cells
                    cell.classList.add('field', 'empty');
                }
                boardElement.appendChild(cell);
            }
        }

        function renderBoard() {
            gameState.board.forEach((piece, idx) => {
                const cell = boardElement.querySelector(`[data-field="${idx}"]`);
                if (!cell) return;
                cell.innerHTML = '';
                cell.classList.remove('selected', 'valid-move');

                if (piece) {
                    const pieceEl = document.createElement('span');
                    pieceEl.classList.add('piece', piece);
                    pieceEl.textContent = piece === 'black' ? '●' : '○';
                    cell.appendChild(pieceEl);
                }
            });
        }

        function updatePieceCount() {
            const blackCount = gameState.board.filter(p => p === 'black').length;
            const whiteCount = gameState.board.filter(p => p === 'white').length;
            
            if (playerColor === 'black') {
                playerPiecesElement.textContent = blackCount;
                opponentPiecesElement.textContent = whiteCount;
            } else {
                playerPiecesElement.textContent = whiteCount;
                opponentPiecesElement.textContent = blackCount;
            }
        }

        function handleFieldClick(fieldIndex) {
            if (!gameActive || gameState.currentPlayer !== playerColor) {
                statusElement.textContent = 'It is not your turn.';
                return;
            }

            if (selectedField === null) {
                // Select a piece to move
                if (gameState.board[fieldIndex] === playerColor) {
                    selectedField = fieldIndex;
                    const cell = boardElement.querySelector(`[data-field="${fieldIndex}"]`);
                    cell.classList.add('selected');

                    // Show valid moves
                    // We need to fetch valid moves from backend or calculate locally
                    socket.emit('getValidMoves', { from: fieldIndex });
                }
            } else {
                // Try to move selected piece
                if (selectedField === fieldIndex) {
                    // Deselect
                    const cell = boardElement.querySelector(`[data-field="${fieldIndex}"]`);
                    cell.classList.remove('selected');
                    selectedField = null;
                } else {
                    // Make a move
                    socket.emit('move', {
                        from: selectedField,
                        to: fieldIndex,
                        gameState
                    });
                    selectedField = null;
                }
            }
        }

        socket.on('validMoves', (data) => {
            boardElement.querySelectorAll('[data-field]').forEach(cell => {
                cell.classList.remove('valid-move');
            });
            data.moves.forEach(moveIdx => {
                const cell = boardElement.querySelector(`[data-field="${moveIdx}"]`);
                if (cell) cell.classList.add('valid-move');
            });
        });

        function leaveGame() {
            gameActive = false;
            statusElement.textContent = 'You left the game.';
            socket.disconnect();
        }

        function showOverlay(title, message) {
            document.getElementById('overlay-title').textContent = title;
            document.getElementById('overlay-message').textContent = message;
            document.getElementById('overlay').style.display = 'flex';
        }

        function closeOverlay() {
            document.getElementById('overlay').style.display = 'none';
        }

        createBoard();
    </script>
</body>

</html>

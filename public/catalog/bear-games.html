<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bear games</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#d8c4a7;color:#30251c}.board{display:grid;grid-template-columns:repeat(3,minmax(70px,120px));gap:5px;justify-content:center;margin:28px auto}.cell{aspect-ratio:1;background:#f4e5c8;border:2px solid #785d40;font-size:34px}.hunters{color:#263d68}.bear{color:#713b25}.selected{outline:4px solid #d19127}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head>
<body><h1>Bear games</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><script>
const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected=null;
socket.on('connect',()=>socket.emit('queue','beargames'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)});socket.on('updateGame',d=>render(d.gameState));socket.on('gameover',d=>status.textContent=`${d.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);
function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((piece,i)=>{const cell=document.createElement('button');cell.className=`cell ${piece||''} ${selected===i?'selected':''}`;cell.textContent=piece==='bear'?'B':piece?'H':'';cell.onclick=()=>click(i);board.appendChild(cell)})}function click(i){if(selected===null){if(state.board[i]===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}
</script></body></html>

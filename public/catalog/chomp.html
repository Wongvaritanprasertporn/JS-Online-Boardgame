<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chomp</title><script src="/socket.io/socket.io.js"></script><style>body{text-align:center;font:16px Georgia;background:#cfbda0}.grid{display:grid;grid-template-columns:repeat(5,60px);justify-content:center}.cell{height:60px;border:1px solid #765;background:#a95e38}.gone{visibility:hidden}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Chomp</h1><p id="s">Connecting...</p><div id="g"></div><script>const x=io(),g=document.getElementById('g'),s=document.getElementById('s');x.on('connect',()=>x.emit('queue','chomp'));x.on('roomFound',d=>render(d.gameState));x.on('updateGame',d=>render(d.gameState));x.on('gameover',d=>s.textContent=`${d.winner} wins`);function render(z){s.textContent=`Turn: ${z.currentPlayer}`;g.className='grid';g.innerHTML='';z.cells.flat().forEach((v,i)=>{const b=document.createElement('button');b.className=v?'cell':'cell gone';b.onclick=()=>x.emit('move',{row:Math.floor(i/5),col:i%5});g.appendChild(b)})}</script></body></html>

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shisima</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;background:#8fc7c2;text-align:center;margin:20px}.board{display:grid;grid-template-columns:repeat(3,90px);gap:6px;justify-content:center;margin:20px}.cell{width:90px;height:90px;border-radius:50%;font-size:40px;background:#e9f6e9;border:2px solid #287c79}</style></head><body><h1>Shisima</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div class="board" id="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected;socket.on('connect',()=>socket.emit('queue','shisima'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{me=p.color;color.textContent=me;render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v?v[0].toUpperCase():'';b.onclick=()=>{if(selected===undefined&&v===me)selected=i;else if(selected!==undefined){socket.emit('move',{from:selected,to:i});selected=undefined}};board.appendChild(b)})}</script></body></html>

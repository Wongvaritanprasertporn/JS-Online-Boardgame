<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong Hau K’i</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#d8c5a8;color:#30251c}.board{position:relative;width:min(88vw,420px);height:360px;margin:30px auto}.point{position:absolute;width:64px;height:64px;margin:-32px;border:2px solid #6a5034;border-radius:50%;font-size:24px}.p0{left:50%;top:8%}.p1{left:14%;top:50%}.p2{left:50%;top:50%}.p3{left:86%;top:50%}.p4{left:50%;top:92%}.black{background:#29241e;color:white}.white{background:white;color:#29241e}.selected{outline:4px solid #d08d21}.edge{position:absolute;background:#967c5d;height:4px;transform-origin:left center}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head>
<body><h1>Pong Hau K’i</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><script>
const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected=null;
socket.on('connect',()=>socket.emit('queue','ponghauki'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)});socket.on('updateGame',d=>render(d.gameState));socket.on('gameover',d=>status.textContent=d.winner==='draw'?'Draw':`${d.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);
function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((piece,i)=>{const point=document.createElement('button');point.className=`point p${i} ${piece||''} ${selected===i?'selected':''}`;point.textContent=piece?'●':'';point.onclick=()=>click(i);board.appendChild(point)})}function click(i){if(selected===null){if(state.board[i]===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}
</script></body></html>

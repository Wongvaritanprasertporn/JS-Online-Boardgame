<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adugo</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;margin:20px;background:#d3b187}.board{display:grid;grid-template-columns:repeat(5,65px);gap:5px;justify-content:center;margin:20px}.cell{width:65px;height:65px;font-size:30px;background:#f4e2c1;border:1px solid #765638}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Adugo</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div class="board" id="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected;socket.on('connect',()=>socket.emit('queue','adugo'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{me=p.color;color.textContent=me;render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('gameover',p=>status.textContent=`${p.winner} win`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v==='tiger'?'J':v==='goat'?'D':'';b.onclick=()=>{if(s.currentPlayer==='goats'&&s.phase==='placement'&&!v)socket.emit('move',{to:i});else if(selected===undefined&&v===me.slice(0,-1))selected=i;else if(selected!==undefined){socket.emit('move',{from:selected,to:i});selected=undefined}};board.appendChild(b)})}</script></body></html>

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Main Machan</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;margin:20px;background:#d0b785}.board{display:grid;grid-template-columns:repeat(7,58px);gap:5px;justify-content:center;margin:20px}.cell{width:58px;height:58px;font-size:26px;background:#f3e6c8;border:1px solid #765638}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Main Machan</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div class="board" id="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected;socket.on('connect',()=>socket.emit('queue','mainmachan'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{me=p.color;color.textContent=me;render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v?v[0].toUpperCase():'';b.onclick=()=>{if(selected===undefined&&v)selected=i;else if(selected!==undefined){socket.emit('move',{from:selected,to:i});selected=undefined}};board.appendChild(b)})}</script></body></html>

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renju</title><script src="/socket.io/socket.io.js"></script><style>body{text-align:center;font:16px Georgia;background:#cfbda0}.grid{display:grid;grid-template-columns:repeat(15,22px);justify-content:center}.cell{height:22px;border:1px solid #765;background:#ecdcc0;border-radius:50%;padding:0}.black{background:#222}.white{background:#fff}</style></head><body><h1>Renju</h1><p id="s">Connecting...</p><div id="g" class="grid"></div><script>const x=io(),g=document.getElementById('g'),s=document.getElementById('s');x.on('connect',()=>x.emit('queue','renju'));x.on('roomFound',d=>render(d.gameState));x.on('updateGame',d=>render(d.gameState));x.on('gameover',d=>s.textContent=`${d.winner} wins`);function render(z){s.textContent=`Turn: ${z.currentPlayer}`;g.innerHTML='';z.board.forEach((v,i)=>{const b=document.createElement('button');b.className=`cell ${v||''}`;b.onclick=()=>x.emit('move',{row:Math.floor(i/15),col:i%15});g.appendChild(b)})}</script></body></html>

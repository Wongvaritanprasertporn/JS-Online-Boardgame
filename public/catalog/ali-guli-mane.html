<!doctype html><html><head><meta charset="UTF-8"><title>Ali Guli Mane</title><script src="/socket.io/socket.io.js"></script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Ali Guli Mane</h1><p id="s"></p><div id="g"></div><script>const x=io(),g=document.getElementById('g'),s=document.getElementById('s');x.on('connect',()=>x.emit('queue','aligulimane'));x.on('roomFound',d=>r(d.gameState));x.on('updateGame',d=>r(d.gameState));function r(a){s.textContent=`Turn: ${a.currentPlayer} Captured: ${a.captured[a.currentPlayer]}`;g.innerHTML='';a.pits.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>x.emit('move',{from:i});b.style.cssText='width:48px;height:48px';g.appendChild(b)})}}</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Heian Shogi</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#302117;background:#cda76f}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#cda76f}main{width:min(700px,100%);margin:auto;text-align:center}.board{width:min(94vw,650px);aspect-ratio:9/8;margin:18px auto;display:grid;grid-template-columns:repeat(9,1fr);border:7px solid #4a2d18}.cell{display:grid;place-items:center;padding:0;border:1px solid #855b35;background:#e5c184;cursor:pointer}.cell:nth-child(odd){background:#c0925a}.cell.selected{outline:3px solid #c62828;outline-offset:-3px}.cell.valid{box-shadow:inset 0 0 0 4px #4e9862}.piece{width:78%;height:78%;display:grid;place-items:center;border:2px solid #4a2d18;clip-path:polygon(50% 0,100% 18%,88% 100%,12% 100%,0 18%);background:#f3dfb0;font:bold clamp(13px,3vw,29px) Arial}.black{color:#171717}.white{color:#9b2d2d}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><main><h1>Heian Shogi</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="board" class="board" aria-label="Heian shogi board"></div></main><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn'),labels={king:'K',gold:'G',silver:'S',knight:'N',lance:'L',pawn:'P'};let player,state,selected;socket.on('connect',()=>socket.emit('queue','heianshogi'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('validMoves',p=>{document.querySelectorAll('.valid').forEach(x=>x.classList.remove('valid'));p.moves.forEach(x=>cell(x.row,x.col).classList.add('valid'))});socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function cell(r,c){return board.children[r*9+c]}function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((row,r)=>row.forEach((piece,c)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.onclick=()=>select(r,c);if(piece){const p=document.createElement('span');p.className=`piece ${piece.color}`;p.textContent=labels[piece.type];b.appendChild(p)}board.appendChild(b)}))}function select(r,c){const piece=state.board[r][c];if(!selected){if(!piece||piece.color!==player||state.currentPlayer!==player)return;selected={row:r,col:c};cell(r,c).classList.add('selected');socket.emit('getValidMoves',{from:selected});return}socket.emit('move',{from:selected,to:{row:r,col:c}});selected=null}</script></body></html>

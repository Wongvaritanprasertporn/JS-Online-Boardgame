<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hnefatafl</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#2d2118;background:#9e8565}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#9e8565}main{width:min(680px,100%);margin:auto;text-align:center}.board{width:min(94vw,630px);aspect-ratio:1;margin:18px auto;display:grid;grid-template-columns:repeat(11,1fr);border:7px solid #493322}.cell{display:grid;place-items:center;padding:0;border:1px solid #876548;background:#d8bc83;cursor:pointer}.cell:nth-child(odd){background:#b59468}.cell.selected{outline:3px solid #d8a83d;outline-offset:-3px}.cell.valid{box-shadow:inset 0 0 0 4px #4e9660}.cell.throne,.cell.corner{background:#72533b}.piece{width:76%;height:76%;display:grid;place-items:center;border:2px solid #493322;border-radius:50%;background:#f1e0b5;font:bold clamp(13px,3vw,29px) Arial}.attackers{color:#232323}.defenders{color:#a32d2d}.king{background:#e8c56a}</style></head><body><main><h1>Hnefatafl</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="board" class="board" aria-label="Hnefatafl board"></div></main><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let player,state,selected;socket.on('connect',()=>socket.emit('queue','hnefatafl'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('validMoves',p=>{document.querySelectorAll('.valid').forEach(x=>x.classList.remove('valid'));p.moves.forEach(x=>cell(x.row,x.col).classList.add('valid'))});socket.on('gameover',p=>status.textContent=`${p.winner} win`);socket.on('errorMessage',m=>status.textContent=m);function cell(r,c){return board.children[r*11+c]}function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((row,r)=>row.forEach((piece,c)=>{const b=document.createElement('button');b.type='button';b.className='cell';if((r===5&&c===5))b.classList.add('throne');if((r===0||r===10)&&(c===0||c===10))b.classList.add('corner');b.onclick=()=>select(r,c);if(piece){const p=document.createElement('span');p.className=`piece ${piece.color} ${piece.type}`;p.textContent=piece.type==='king'?'K':piece.color==='attackers'?'A':'D';b.appendChild(p)}board.appendChild(b)}))}function select(r,c){const piece=state.board[r][c];if(!selected){if(!piece||piece.color!==player||state.currentPlayer!==player)return;selected={row:r,col:c};cell(r,c).classList.add('selected');socket.emit('getValidMoves',{from:selected});return}socket.emit('move',{from:selected,to:{row:r,col:c}});selected=null}</script></body></html>

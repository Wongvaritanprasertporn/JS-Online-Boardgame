<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wythoff's Game</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;margin:20px;background:#c1d4e4}.pile{display:inline-flex;flex-direction:column;align-items:center;margin:30px;padding:25px;border-radius:12px;background:#f4f8fb}button{padding:12px 18px;margin:6px;font:inherit}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Wythoff's Game</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="game"></div><script>const socket=io(),game=document.getElementById('game'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state;socket.on('connect',()=>socket.emit('queue','wythoff'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{me=p.color;color.textContent=me;render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;game.innerHTML=`<div class="pile"><strong>Pile A</strong><span>${s.piles[0]}</span><button onclick="remove(0,1)">Remove 1</button><button onclick="remove(0,${s.piles[0]})">Empty pile</button></div><div class="pile"><strong>Pile B</strong><span>${s.piles[1]}</span><button onclick="remove(1,1)">Remove 1</button><button onclick="remove(1,${s.piles[1]})">Empty pile</button></div><div><button onclick="remove(0,1);remove(1,1)">Remove equally</button></div>`}function remove(pile,count){if(state.currentPlayer===me&&!state.isGameOver)socket.emit('move',{removeA:pile===0?count:0,removeB:pile===1?count:0})}</script></body></html>

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kōnane</title><script src="/socket.io/socket.io.js"></script><style>body{text-align:center;font:16px Georgia;background:#cfbda0}.board{display:grid;grid-template-columns:repeat(6,48px);justify-content:center}.cell{height:48px;border:1px solid #765;background:#ecdcc0}.cell:nth-child(even){background:#a78967}.black{background:#222!important}.white{background:#fff}.selected{outline:3px solid #d08e27}</style></head><body><h1>Kōnane</h1><p id="s">Connecting...</p><div id="g" class="board"></div><script>const x=io(),g=document.getElementById('g'),s=document.getElementById('s');let me,z,sel=null;x.on('connect',()=>x.emit('queue','konane'));x.on('roomFound',d=>{me=d.color;render(d.gameState)});x.on('updateGame',d=>render(d.gameState));x.on('gameover',d=>s.textContent=`${d.winner} wins`);function render(a){z=a;s.textContent=`You: ${me||'-'} Turn: ${a.currentPlayer} Phase: ${a.phase}`;g.innerHTML='';a.board.forEach((p,i)=>{const b=document.createElement('button');b.className=`cell ${p||''} ${sel===i?'selected':''}`;b.onclick=()=>{if(sel===null){if(p===me)sel=i}else{x.emit('move',{from:sel,to:i});sel=null}render(z)};g.appendChild(b)})}</script></body></html>

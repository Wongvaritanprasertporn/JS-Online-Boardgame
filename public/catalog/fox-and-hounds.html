<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fox and Hounds</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#d7c0a1;color:#30251c}.board{display:grid;grid-template-columns:repeat(8,minmax(32px,58px));justify-content:center;margin:24px auto}.cell{aspect-ratio:1;border:0;font-size:25px}.light{background:#ead8b8}.dark{background:#896e50}.fox{color:#c45d27}.hounds{color:#233f69}.selected{outline:3px solid #f0c329;z-index:1}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head>
<body><h1>Fox and Hounds</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><script>
const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected=null;
socket.on('connect',()=>socket.emit('queue','foxandhounds'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)});socket.on('updateGame',d=>render(d.gameState));socket.on('gameover',d=>status.textContent=`${d.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);
function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((piece,i)=>{const cell=document.createElement('button');cell.className=`cell ${((Math.floor(i/8)+i%8)%2?'light':'dark')} ${piece||''} ${selected===i?'selected':''}`;cell.textContent=piece==='fox'?'F':piece?'H':'';cell.onclick=()=>click(i);board.appendChild(cell)})}function click(i){if(selected===null){if(state.board[i]===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}
</script></body></html>

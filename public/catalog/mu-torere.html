<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mū tōrere</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#c8d8c0;color:#243125}.board{position:relative;width:min(88vw,420px);aspect-ratio:1;margin:35px auto}.point{position:absolute;width:62px;height:62px;margin:-31px;border-radius:50%;border:2px solid #39563d;font-size:22px}.p0{left:50%;top:50%}.p1{left:50%;top:4%}.p2{left:82%;top:18%}.p3{left:96%;top:50%}.p4{left:82%;top:82%}.p5{left:50%;top:96%}.p6{left:18%;top:82%}.p7{left:4%;top:50%}.p8{left:18%;top:18%}.black{background:#26302a;color:white}.white{background:white}.selected{outline:4px solid #d3922f}</style></head>
<body><h1>Mū tōrere</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><script>
const socket=io(), board=document.getElementById('board'), status=document.getElementById('status'), color=document.getElementById('color'), turn=document.getElementById('turn'); let me,state,selected=null;
socket.on('connect',()=>socket.emit('queue','mutorere')); socket.on('queueWaiting',d=>status.textContent=d.message); socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)}); socket.on('updateGame',d=>render(d.gameState)); socket.on('gameover',d=>status.textContent=`${d.winner} wins`); socket.on('errorMessage',m=>status.textContent=m);
function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((piece,i)=>{const point=document.createElement('button');point.className=`point p${i} ${piece||''} ${selected===i?'selected':''}`;point.textContent=piece?'●':'';point.onclick=()=>click(i);board.appendChild(point)})} function click(i){if(selected===null){if(state.board[i]===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}
</script></body></html>

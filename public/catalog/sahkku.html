<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sáhkku</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#cfbda0;color:#30251c}.board{display:grid;grid-template-columns:repeat(15,minmax(22px,42px));gap:3px;justify-content:center;margin:24px auto}.cell{aspect-ratio:1;border:1px solid #806649;font-size:15px;background:#ecdcc0}.middle{background:#bd9b59}.black{background:#29241f;color:#fff}.white{background:#fff;color:#29241f}.selected{outline:3px solid #d08e27}.controls button{margin:4px;padding:8px}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Sáhkku</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b> Roll: <b id="roll">-</b></p><div class="controls"><button onclick="roll(1)">Roll 1</button><button onclick="roll(2)">Roll 2</button><button onclick="roll(3)">Roll 3</button></div><div id="board" class="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn'),rollValue=document.getElementById('roll');let me,state,selected=null;socket.on('connect',()=>socket.emit('queue','sahkku'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)});socket.on('updateGame',d=>render(d.gameState));socket.on('gameover',d=>status.textContent=`${d.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function roll(value){if(state.currentPlayer===me)socket.emit('sahkkuRoll',{value})}function render(s){state=s;turn.textContent=s.currentPlayer;rollValue.textContent=s.roll||'-';board.innerHTML='';s.board.forEach((piece,i)=>{const cell=document.createElement('button');cell.className=`cell ${i>=15&&i<30?'middle ':''}${piece?.color||''} ${selected===i?'selected':''}`;cell.textContent=piece?(piece.active?'●':'○'):'';cell.onclick=()=>click(i);board.appendChild(cell)})}function click(i){if(selected===null){if(state.board[i]?.color===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shogi</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#342116;background:#d2a665}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#d2a665}main{width:min(720px,100%);margin:auto;text-align:center}.board{width:min(94vw,630px);aspect-ratio:1;margin:18px auto;display:grid;grid-template-columns:repeat(9,1fr);border:7px solid #4a2d18}.cell{display:grid;place-items:center;padding:0;border:1px solid #8a6033;background:#e3bd79;cursor:pointer}.cell:nth-child(odd){background:#d5a961}.cell.selected{outline:3px solid #c62828;outline-offset:-3px}.cell.valid{box-shadow:inset 0 0 0 4px #4e9862}.piece{width:78%;height:78%;display:grid;place-items:center;border:2px solid #4a2d18;clip-path:polygon(50% 0,100% 18%,88% 100%,12% 100%,0 18%);background:#f0d9a8;font:bold clamp(13px,3.5vw,30px) Arial}.black{color:#171717}.white{color:#9b2d2d}.hands{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px}.hand button{margin:2px;padding:5px 8px;font:inherit}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><main><h1>Shogi</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="hands" class="hands"></div><div id="board" class="board" aria-label="Shogi board"></div></main><script>const socket=io(),board=document.getElementById('board'),hands=document.getElementById('hands'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn'),labels={king:'K',rook:'R',bishop:'B',gold:'G',silver:'S',knight:'N',lance:'L',pawn:'P'};let player,state,selected,dropType;socket.on('connect',()=>socket.emit('queue','shogi'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('validMoves',p=>{document.querySelectorAll('.valid').forEach(x=>x.classList.remove('valid'));p.moves.forEach(x=>cell(x.row,x.col).classList.add('valid'))});socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function cell(r,c){return board.children[r*9+c]}function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((row,r)=>row.forEach((piece,c)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.onclick=()=>select(r,c);if(piece){const p=document.createElement('span');p.className=`piece ${piece.color}`;p.textContent=labels[piece.type];b.appendChild(p)}board.appendChild(b)}));hands.innerHTML='';Object.entries(s.hands[player]||{}).forEach(([type,count])=>{if(count){const b=document.createElement('button');b.textContent=`${labels[type]} x${count}`;b.onclick=()=>{dropType=type;selected=null};hands.appendChild(b)}})}function select(r,c){if(dropType){socket.emit('move',{drop:true,type:dropType,to:{row:r,col:c}});dropType=null;return}const piece=state.board[r][c];if(!selected){if(!piece||piece.color!==player||state.currentPlayer!==player)return;selected={row:r,col:c};cell(r,c).classList.add('selected');socket.emit('getValidMoves',{from:selected});return}socket.emit('move',{from:selected,to:{row:r,col:c}});selected=null}</script></body></html>

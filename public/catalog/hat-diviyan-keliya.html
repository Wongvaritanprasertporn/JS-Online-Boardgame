<!doctype html><html><head><meta charset="UTF-8"><title>Hat Diviyan Keliya</title><script src="/socket.io/socket.io.js"></script></head><body><h1>Hat Diviyan Keliya</h1><p id="s"></p><div id="g"></div><script>const x=io(),g=document.getElementById('g'),s=document.getElementById('s');let z,sel=null;x.on('connect',()=>x.emit('queue','hatdiviyankeliya'));x.on('roomFound',d=>r(d.gameState));x.on('updateGame',d=>r(d.gameState));x.on('gameover',d=>s.textContent=`${d.winner} wins`);function r(a){z=a;s.textContent=`Turn: ${a.currentPlayer}`;g.innerHTML='';a.board.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p==='leopard'?'L':p?'●':'';b.style.cssText='width:38px;height:38px';b.onclick=()=>{if(sel===null)sel=i;else{x.emit('move',{from:sel,to:i});sel=null}r(z)};g.appendChild(b)})}</script></body></html>

<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jungle</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#d9c6a5;color:#30251c;margin:18px}.board{display:grid;grid-template-columns:repeat(7,minmax(38px,64px));grid-template-rows:repeat(9,minmax(38px,64px));gap:2px;justify-content:center;margin:18px auto}.cell{border:1px solid #5c4634;background:#ead8b8;font-size:25px;padding:0}.water{background:#86b7c5}.den{background:#d58d72}.black{color:#202020}.white{color:#fafafa;text-shadow:0 0 2px #111}.selected{outline:3px solid #f0c419}.legend{max-width:520px;margin:auto}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head>
<body><h1>Jungle</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><p class="legend">Ranks: rat, cat, dog, wolf, leopard, tiger, lion, elephant. Capture equal or lower ranks; rats can capture elephants.</p>
<script>
const socket = io();
const board = document.getElementById('board');
const status = document.getElementById('status');
const color = document.getElementById('color');
const turn = document.getElementById('turn');
const water = [22, 23, 25, 26, 29, 30, 32, 33, 36, 37, 39, 40, 43, 44, 46, 47];
const icons = { rat: 'R', cat: 'C', dog: 'D', wolf: 'W', leopard: 'L', tiger: 'T', lion: 'N', elephant: 'E' };
let me;
let state;
let selected = null;
socket.on('connect', () => socket.emit('queue', 'jungle'));
socket.on('queueWaiting', (data) => { status.textContent = data.message; });
socket.on('roomFound', (data) => { me = data.color; color.textContent = me; render(data.gameState); });
socket.on('updateGame', (data) => render(data.gameState));
socket.on('gameover', (data) => { status.textContent = `${data.winner} wins`; });
socket.on('errorMessage', (message) => { status.textContent = message; });
function render(nextState) {
  state = nextState;
  turn.textContent = state.currentPlayer;
  board.innerHTML = '';
  state.board.forEach((piece, index) => {
    const cell = document.createElement('button');
    cell.className = `cell ${index === 3 || index === 59 ? 'den ' : ''}${water.includes(index) ? 'water ' : ''}${piece?.color || ''}`;
    cell.textContent = piece ? icons[piece.type] : '';
    cell.classList.toggle('selected', selected === index);
    cell.onclick = () => selectCell(index);
    board.appendChild(cell);
  });
}
function selectCell(index) {
  if (selected === null) {
    if (state.board[index]?.color === me && state.currentPlayer === me) selected = index;
  } else {
    socket.emit('move', { from: selected, to: index });
    selected = null;
  }
  render(state);
}
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tic-tac-toe</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#24202d;background:#d9c6ed}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#d9c6ed}main{width:min(500px,100%);margin:auto;text-align:center}.board{width:min(88vw,420px);aspect-ratio:1;margin:22px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;border-radius:12px;background:#5b3b79}.cell{display:grid;place-items:center;border:0;border-radius:8px;background:#f8f2ff;cursor:pointer;font:bold clamp(42px,15vw,90px) Arial}.x{color:#d04b5b}.o{color:#327a9d}</style></head><body><main><h1>Tic-tac-toe</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="board" class="board" aria-label="Tic-tac-toe board"></div></main><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let player,state;socket.on('connect',()=>socket.emit('queue','tictactoe'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('gameover',p=>status.textContent=p.winner==='draw'?'Draw':`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((value,index)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.onclick=()=>{if(!value&&!state.isGameOver&&state.currentPlayer===player)socket.emit('move',{position:index})};if(value){b.textContent=value.toUpperCase();b.classList.add(value)}board.appendChild(b)})}</script></body></html>

<!doctype html><html><head><meta charset="UTF-8"><title>Choko</title><script src="/socket.io/socket.io.js"></script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Choko</h1><div id="status">Connecting...</div><div id="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status');let state,selected=null;socket.on('connect',()=>socket.emit('queue','choko'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{state=d.gameState;render();});socket.on('updateGame',d=>{state=d.gameState;render();});function render(){board.innerHTML='';state.board.forEach((piece,i)=>{const b=document.createElement('button');b.textContent=piece||'';b.style.width='38px';b.style.height='38px';b.onclick=()=>{if(selected===null){if(piece===state.currentPlayer)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null;}};board.appendChild(b);});status.textContent='Turn: '+state.currentPlayer;}</script></body></html>

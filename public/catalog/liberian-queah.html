<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liberian Queah</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#cfbda0;color:#30251c}.board{display:grid;grid-template-columns:repeat(7,minmax(38px,70px));gap:5px;justify-content:center;margin:28px auto}.cell{aspect-ratio:1;border:1px solid #806649;border-radius:50%;font-size:22px;background:#ecdcc0}.black{background:#29241f;color:#fff}.white{background:#fff;color:#29241f}.selected{outline:3px solid #d08e27}</style></head><body><h1>Liberian Queah</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b> Reserve: <b id="reserve">-</b></p><div id="board" class="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn'),reserve=document.getElementById('reserve');let me,state,selected=null;socket.on('connect',()=>socket.emit('queue','liberianqueah'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)});socket.on('updateGame',d=>render(d.gameState));socket.on('gameover',d=>status.textContent=`${d.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;reserve.textContent=s.reserve[me];board.innerHTML='';s.board.forEach((piece,i)=>{const cell=document.createElement('button');cell.className=`cell ${piece||''} ${selected===i?'selected':''}`;cell.textContent=piece?'●':'';cell.onclick=()=>click(i);board.appendChild(cell)})}function click(i){if(selected===null){if(state.mustPlace[me]&&state.currentPlayer===me)socket.emit('move',{to:i});else if(state.board[i]===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}</script></body></html>

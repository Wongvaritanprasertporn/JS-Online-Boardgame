<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Makruk</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#302117;background:#c69b69}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#c69b69}main{width:min(680px,100%);margin:auto;text-align:center}.board{width:min(92vw,620px);aspect-ratio:1;margin:18px auto;display:grid;grid-template-columns:repeat(8,1fr);border:7px solid #452d1c}.cell{display:grid;place-items:center;padding:0;border:1px solid #7c5536;background:#e3bd82;cursor:pointer}.cell:nth-child(odd){background:#b6804e}.cell.selected{outline:3px solid #d62828;outline-offset:-3px}.cell.valid{box-shadow:inset 0 0 0 4px #4d9560}.piece{width:76%;height:76%;display:grid;place-items:center;border:2px solid #452d1c;border-radius:50%;background:#f5dfb2;font:bold clamp(15px,4vw,32px) Arial}.white{color:#8d2929}.black{color:#171717}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><main><h1>Makruk</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="board" class="board" aria-label="Makruk board"></div></main><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn'),labels={king:'K',seed:'S',nobleman:'N',elephant:'E',horse:'H',boat:'B',pawn:'P',promotedPawn:'S'};let player,state,selected;socket.on('connect',()=>socket.emit('queue','makruk'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('validMoves',p=>{document.querySelectorAll('.valid').forEach(x=>x.classList.remove('valid'));p.moves.forEach(x=>cell(x.row,x.col).classList.add('valid'))});socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function cell(r,c){return board.children[r*8+c]}function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((row,r)=>row.forEach((piece,c)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.onclick=()=>select(r,c);if(piece){const p=document.createElement('span');p.className=`piece ${piece.color}`;p.textContent=labels[piece.type];b.appendChild(p)}board.appendChild(b)}))}function select(r,c){const piece=state.board[r][c];if(!selected){if(!piece||piece.color!==player||state.currentPlayer!==player)return;selected={row:r,col:c};cell(r,c).classList.add('selected');socket.emit('getValidMoves',{from:selected});return}socket.emit('move',{from:selected,to:{row:r,col:c}});selected=null}</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shatra</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>:root{font-family:Georgia,serif;color:#302117;background:#536878}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;background:#536878}main{width:min(700px,100%);margin:auto;text-align:center}.board{width:min(96vw,650px);min-height:520px;margin:18px auto;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(13,1fr);gap:2px;padding:8px;background:#2d2520;border:7px solid #171411}.cell{display:grid;place-items:center;min-height:34px;padding:0;border:1px solid #8b735b;background:#d8bc86;cursor:pointer}.cell.reserve{background:#8d9b8f}.cell.valid{box-shadow:inset 0 0 0 4px #58a66b}.cell.selected{outline:3px solid #e6b84d;outline-offset:-3px}.piece{width:76%;height:76%;display:grid;place-items:center;border:2px solid #3b2d20;border-radius:50%;background:#f4e2b5;font:bold clamp(12px,3vw,26px) Arial}.white{color:#9e2e2e}.black{color:#171717}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><main><h1>Shatra</h1><div id="status">Connecting...</div><p>You: <strong id="color">-</strong> | Turn: <strong id="turn">-</strong></p><div id="board" class="board" aria-label="Shatra 62-tile board"></div></main><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn'),labels={king:'K',queen:'Q',rook:'R',bishop:'B',pawn:'P'};let player,state,selected;socket.on('connect',()=>socket.emit('queue','shatra'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{player=p.color;color.textContent=player;status.textContent='Game started';render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('validMoves',p=>{document.querySelectorAll('.valid').forEach(x=>x.classList.remove('valid'));p.moves.forEach(x=>cell(x.index).classList.add('valid'))});socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function cell(index){return board.querySelector(`[data-index="${index}"]`)}function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';const nodes=[...Array(6)].flatMap((_,row)=>[...Array(7)].map((_,col)=>({row:row+3,col})));for(let row=0;row<3;row++)for(let col=0;col<3;col++)nodes.push({row,col});nodes.push({row:2,col:3},{row:9,col:3});for(let row=10;row<13;row++)for(let col=4;col<7;col++)nodes.push({row,col});nodes.forEach((node,index)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.dataset.index=index;b.style.gridRow=node.row+1;b.style.gridColumn=node.col+1;b.onclick=()=>select(index);const piece=s.board[index];if(piece){const p=document.createElement('span');p.className=`piece ${piece.color}`;p.textContent=labels[piece.type];b.appendChild(p);if(piece.reserve)b.classList.add('reserve')}board.appendChild(b)})}function select(index){const piece=state.board[index];if(!selected){if(!piece||piece.color!==player||state.currentPlayer!==player)return;selected=index;cell(index).classList.add('selected');socket.emit('getValidMoves',{from:{index}});return}socket.emit('move',{from:{index:selected},to:{index}});selected=null}</script></body></html>

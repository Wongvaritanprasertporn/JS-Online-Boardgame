<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three Men's Morris</title><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><style>body{font:16px Georgia;background:#d8c09a;text-align:center;margin:20px}.board{display:grid;grid-template-columns:repeat(3,80px);gap:6px;justify-content:center;margin:20px}.cell{width:80px;height:80px;font-size:36px;background:#f3e5c7;border:1px solid #765638}.black{color:#111}.white{color:#b22}</style></head><body><h1>Three Men's Morris</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Turn: <b id="turn">-</b></p><div class="board" id="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),turn=document.getElementById('turn');let me,state,selected;socket.on('connect',()=>socket.emit('queue','threemorris'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',p=>{me=p.color;color.textContent=me;render(p.gameState)});socket.on('updateGame',p=>render(p.gameState));socket.on('gameover',p=>status.textContent=`${p.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v?v[0].toUpperCase():'';b.onclick=()=>{if(!selected&&v===me){selected=i;return}if(selected!==null&&selected!==undefined){socket.emit('move',{from:selected,to:i});selected=null}else if(!v&&s.phase==='placement')socket.emit('move',{position:i})};board.appendChild(b)})}</script></body></html>

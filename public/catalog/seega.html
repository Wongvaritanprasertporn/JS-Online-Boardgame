<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seega</title><script src="/socket.io/socket.io.js"></script><style>body{font:16px Georgia;text-align:center;background:#d0bea1;color:#30251c}.board{display:grid;grid-template-columns:repeat(5,minmax(52px,90px));justify-content:center;margin:24px auto}.cell{aspect-ratio:1;border:1px solid #806649;font-size:24px;background:#ecdcc0}.cell:nth-child(even){background:#a78967}.black{background:#29241f!important;color:#fff}.white{background:#fff!important;color:#29241f}.blocked{background:#bd9b59!important;color:#30251c}.selected{outline:3px solid #d08e27}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2220038691270052" crossorigin="anonymous"></script></head><body><h1>Seega</h1><p id="status">Connecting...</p><p>You: <b id="color">-</b> Phase: <b id="phase">-</b> Turn: <b id="turn">-</b></p><div id="board" class="board"></div><script>const socket=io(),board=document.getElementById('board'),status=document.getElementById('status'),color=document.getElementById('color'),phase=document.getElementById('phase'),turn=document.getElementById('turn');let me,state,selected=null;socket.on('connect',()=>socket.emit('queue','seega'));socket.on('queueWaiting',d=>status.textContent=d.message);socket.on('roomFound',d=>{me=d.color;color.textContent=me;render(d.gameState)});socket.on('updateGame',d=>render(d.gameState));socket.on('gameover',d=>status.textContent=`${d.winner} wins`);socket.on('errorMessage',m=>status.textContent=m);function render(s){state=s;phase.textContent=s.phase;turn.textContent=s.currentPlayer;board.innerHTML='';s.board.forEach((piece,i)=>{const cell=document.createElement('button');cell.className=`cell ${piece||''} ${selected===i?'selected':''}`;cell.textContent=piece==='blocked'?'X':piece?'●':'';cell.onclick=()=>click(i);board.appendChild(cell)})}function click(i){if(selected===null){if(state.phase==='placement'){if(!state.board[i])socket.emit('move',{to:i})}else if(state.board[i]===me)selected=i}else{socket.emit('move',{from:selected,to:i});selected=null}render(state)}</script></body></html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JS Online Boardgames</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #123524;
            color: #f5f1e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #123524, #1f6f46);
        }

        main {
            width: min(760px, 100%);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 6vw, 4rem);
        }

        .intro {
            margin: 0 0 32px;
            color: #d8eadc;
            font-size: 1.1rem;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
        }

        .statistics {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #8bb99a;
        }

        .statistics h2 {
            margin: 0 0 12px;
        }

        #leaderboard {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #leaderboard li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
        }

        .game-link {
            display: flex;
            min-height: 150px;
            padding: 24px;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            color: #123524;
            background: #f5f1e8;
            border: 2px solid transparent;
            border-radius: 10px;
            text-decoration: none;
            transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
        }

        .game-link:hover,
        .game-link:focus-visible {
            background: #ffffff;
            border-color: #f2c14e;
            transform: translateY(-4px);
            outline: none;
        }

        .game-link strong {
            font-size: 1.25rem;
        }

        .game-link span {
            color: #42634e;
        }
    </style>
</head>

<body>
    <main>
        <h1>JS Online Boardgames</h1>
        <p class="intro">Choose a game. Your country is detected automatically.</p>
        <nav class="games" aria-label="Games">
            <a class="game-link" href="/reversi">
                <strong>Reversi</strong>
            </a>
            <a class="game-link" href="/twelve-mens-morris">
                <strong>Twelve Men's Morris</strong>
            </a>
            <a class="game-link" href="/five-field-kono">
                <strong>Five-Field Kono</strong>
            </a>
        </nav>
        <section class="statistics" aria-labelledby="statistics-heading">
            <h2 id="statistics-heading">Wins by country</h2>
            <ol id="leaderboard"><li>Loading statistics...</li></ol>
        </section>
    </main>
    <script>
        fetch('/api/statistics/wins-by-country')
            .then((response) => response.json())
            .then((statistics) => {
                const leaderboard = document.getElementById('leaderboard');
                leaderboard.innerHTML = statistics.length
                    ? statistics.map((item) => `<li><span>${item.country}</span><strong>${item.wins}</strong></li>`).join('')
                    : '<li>No wins recorded yet.</li>';
            })
            .catch(() => {
                document.getElementById('leaderboard').innerHTML = '<li>Statistics unavailable.</li>';
            });
    </script>
</body>

</html>
